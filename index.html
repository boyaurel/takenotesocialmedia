<style>

:root{--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);--v:#7B61FF;--o:#FF8A3D;--navh:62px;
 --navb:calc(var(--sb) + 10px);--above:calc(var(--navh) + var(--navb) + 14px);color-scheme:dark;
 --rf:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{height:100%;background:#000;color:#fff;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.glass{background:rgba(22,22,28,.38);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(255,255,255,.13)}

.post{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#0d0d0d}
.media{position:absolute;top:0;right:0;bottom:0;left:0}

.post.blocked .pauseico{opacity:1;transform:none}

.ph{position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(160deg,var(--c1),var(--c2) 55%,var(--c3));overflow:hidden}
.ph i{position:absolute;border-radius:50%;filter:blur(42px);opacity:.75;animation:fl 9s ease-in-out infinite alternate}
.ph .b1{width:75%;height:45%;left:-12%;top:8%;background:var(--c3)}

.post.paused .ph i{animation-play-state:paused}
.ovl{position:absolute;left:0;right:0;top:34%;text-align:center;padding:0 36px;font-family:var(--rf);font-weight:800;font-size:27px;line-height:1.2;text-shadow:0 2px 14px rgba(0,0,0,.45);text-wrap:balance}
.greenbox{position:absolute;top:0;right:0;bottom:0;left:0;background:#00b140}
.mk{position:absolute;width:20px;height:20px}
.mk::before,.mk::after{content:"";position:absolute;background:#fff;box-shadow:0 0 0 1px #000}
.mk::before{left:9px;top:0;width:2px;height:20px}.mk::after{top:9px;left:0;height:2px;width:20px}
.mk.tl{left:14%;top:20%}.mk.tr{right:26%;top:20%}.mk.bl{left:14%;bottom:38%}.mk.br{right:26%;bottom:38%}
.shade{position:absolute;left:0;right:0;bottom:0;height:52%;background:linear-gradient(transparent,rgba(0,0,0,.6));pointer-events:none}
#topshade{position:fixed;left:0;right:0;top:0;height:calc(150px + var(--st));background:linear-gradient(rgba(0,0,0,.5),transparent);pointer-events:none;z-index:3}
.pauseico{position:absolute;left:50%;top:50%;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;display:grid;place-items:center;opacity:0;transform:scale(.85);transition:.18s;pointer-events:none}
.pauseico svg{width:30px;height:30px;margin-left:4px}
.post.paused .pauseico{opacity:1;transform:none}
/* right action capsule */
.rail{position:absolute;right:10px;bottom:calc(var(--above) + 16px);width:58px;border-radius:30px;padding:14px 0 12px;display:flex;flex-direction:column;align-items:center;z-index:2}
.act{display:flex;flex-direction:column;align-items:center;font-family:var(--rf);font-size:12px;font-weight:700}

.av{width:40px;height:40px;flex:none;border-radius:13px;overflow:hidden;display:grid;place-items:center;font-family:var(--rf);font-weight:800;font-size:17px;box-shadow:0 0 0 2px rgba(255,255,255,.85)}

.vf{width:15px;height:15px;flex:none}
.fol{margin-left:4px;font-size:13px;font-weight:700;padding:6px 14px;border-radius:999px;background:linear-gradient(90deg,var(--v),var(--o));text-shadow:none;flex:none}
.fol.on{background:rgba(255,255,255,.18);font-weight:600}
.cap{font-size:14.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cap.open{display:block}

.snd{display:inline-flex;align-items:center;margin-top:10px;font-size:12.5px;font-weight:600;padding:6px 12px 6px 9px;border-radius:999px;max-width:78%;text-shadow:none}
.snd svg{width:16px;height:16px;flex:none}
.mq{overflow:hidden;white-space:nowrap}
.mq span{display:inline-block;animation:mq 10s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.prog{position:absolute;left:16px;right:16px;bottom:calc(var(--above) - 2px);height:3px;border-radius:2px;background:rgba(255,255,255,.2);z-index:2;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--v),var(--o))}
.burst{position:absolute;width:104px;height:104px;margin:-52px 0 0 -52px;pointer-events:none;z-index:6;animation:burst .85s ease-out forwards;filter:drop-shadow(0 4px 16px rgba(0,0,0,.35))}
.burst svg{width:100%;height:100%;fill:url(#gLike)}
@keyframes burst{0%{transform:rotate(var(--r)) scale(.3);opacity:0}15%{transform:rotate(var(--r)) scale(1.15);opacity:1}30%{transform:rotate(var(--r)) scale(.95)}70%{transform:rotate(var(--r)) scale(1);opacity:1}100%{transform:rotate(var(--r)) scale(1.35) translateY(-60px);opacity:0}}
/* top */
#top{position:fixed;left:0;right:0;top:calc(var(--st) + 8px);z-index:4;padding:0 14px}
.brandrow{display:flex;align-items:center;justify-content:space-between;height:40px}
#brand{display:flex;align-items:center;padding:8px 14px 8px 0;margin:-8px 0;touch-action:none;-webkit-user-select:none;font-family:var(--rf);font-weight:800;font-size:25px;letter-spacing:-.5px;cursor:pointer}

.tico{display:flex}

#tabs{margin:8px auto 0;width:max-content;display:flex;padding:4px;border-radius:999px}
#tabs span{padding:7px 15px;border-radius:999px;font-size:14px;font-weight:600;opacity:.8;transition:background .2s,color .2s}
#tabs span.on{background:#fff;color:#000;opacity:1}
/* floating nav */
#nav{position:fixed;left:14px;right:14px;bottom:var(--navb);height:var(--navh);border-radius:24px;display:flex;align-items:center;z-index:5;background:rgba(18,18,22,.72)}
#nav a{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:rgba(255,255,255,.6);position:relative}
#nav a.on{color:#fff}
#nav a.on::after{content:"";width:5px;height:5px;border-radius:50%;background:linear-gradient(90deg,var(--v),var(--o))}
#nav a:not(.on)::after{content:"";width:5px;height:5px}

/* comments */
#back{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}

.grab{width:38px;height:5px;border-radius:3px;background:#55555c;margin:8px auto 0}
.shh{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 10px 20px}
.shh h3{font-family:var(--rf);font-size:18px;font-weight:800}

#clist{flex:1;overflow-y:auto;padding:0 18px 8px;-webkit-overflow-scrolling:touch}
.c{display:flex;padding:11px 0}
.cav{width:36px;height:36px;border-radius:12px;flex:none;display:grid;place-items:center;font-family:var(--rf);font-weight:800;font-size:15px}
.cb{flex:1}
.cn{font-size:13px;font-weight:600;color:#c9c9d1;margin-bottom:2px;display:flex;align-items:center}

.ct{font-size:14.5px;line-height:1.4}
.cm{font-size:12px;color:#8a8a93;margin-top:5px;font-weight:500}
.cl{display:flex;flex-direction:column;align-items:center;padding-top:6px;color:#8a8a93;font-size:11px;font-weight:600;width:32px}
.cl svg{width:18px;height:18px}
.cl.on{color:#ff5a7a}.cl.on svg{fill:#ff5a7a;stroke:#ff5a7a}
.cin{display:flex;align-items:center;padding:10px 12px}
.cin input{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:11px 15px;color:#fff;font-size:16px;outline:none}

.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.btn{background:#2c2c34;border-radius:9px;padding:10px 13px;font-size:14px;font-weight:600;min-height:40px}
.btn.pri{background:linear-gradient(90deg,var(--v),var(--o))}
.btn.dng{color:#ff7a7a}
.row{display:flex;flex-wrap:wrap;margin-top:10px}
.file{display:block;background:#2a2a32;border:1px dashed #555;border-radius:9px;padding:10px;font-size:14px;color:#ddd;text-align:center;cursor:pointer}

.row{margin-bottom:-8px}.row>*{margin:0 8px 8px 0}

  <p class="note">${isWeb?'Running as a website: '+esc(location.host):'Opened as a file on this computer (fine for checking; the phone needs the website version).'} · Videos found in folder: ${Object.values(diag).filter(d=>d.video&&d.video.status==='ok').length} of ${cfg.posts.length}</p>
  ${(__errs.length||Object.keys(vErr).length)?`<p class="note" style="color:#ffb35c">Problems log (screenshot this if something is wrong):<br>${[...Object.entries(vErr).map(([i,m])=>'Post '+(+i+1)+': '+m),...__errs.slice(-8)].map(esc).join('<br>')}</p>`:'<p class="note" style="color:#7d9">No errors so far.</p>'}
  <p class="note">${esc(navigator.userAgent.replace(/^.*?\((.*?)\).*$/,'$1'))}</p>
  ${persistOK?'':'<p class="note" style="color:#ffb35c">This browser will not keep videos chosen here after a reload. Use the videos folder instead.</p>'}
 </section>
 ${cfg.posts.map((p,i)=>card(p,i,cfg.posts.length)).join('')}
 <button class="btn" data-op="add" style="width:100%">+ Add post</button>`;
 su.classList.add('on');su.scrollTop=0;
 feed.querySelectorAll('video').forEach(v=>v.pause());
}
function readForm(){
 const s=cfg.settings,sel=su.querySelector('#sStart');if(!sel)return;
 s.startIndex=+sel.value||0;s.sound=su.querySelector('#sSound').checked;s.markers=su.querySelector('#sMarkers').checked;s.badge=su.querySelector('#sBadge').value.trim();
 su.querySelectorAll('[data-pi]').forEach(c=>{const p=cfg.posts[+c.dataset.pi];
  c.querySelectorAll('[data-f]').forEach(f=>{const k=f.dataset.f;p[k]=f.type==='checkbox'?f.checked:f.type==='number'||k==='palette'?(+f.value||0):f.value});
  const x=st[p.id];if(x){x.likes=+p.likes+(x.liked?1:0);x.saves=+p.saves+(x.saved?1:0);x.reposts=+p.reposts+(x.reposted?1:0);x.shares=+p.shares;x.comments=+p.comments+x.mine.length}});
}
async function setFile(p,kind,file){const k=p.id+':'+kind;if(urls[k]&&urls[k].startsWith('blob:'))URL.revokeObjectURL(urls[k]);
 urls[k]=URL.createObjectURL(file);p['has_'+kind]=true;try{await putF(k,file)}catch(e){persistOK=false}}
async function clearFile(p,kind){const k=p.id+':'+kind;if(urls[k]&&urls[k].startsWith('blob:'))URL.revokeObjectURL(urls[k]);delete urls[k];p['has_'+kind]=false;await delF(k)}
su.addEventListener('change',async e=>{const f=e.target.closest('[data-file]');if(!f||!f.files[0])return;
 readForm();const p=cfg.posts[+f.closest('[data-pi]').dataset.pi];
 f.parentElement.firstChild.textContent='Saving…';await setFile(p,f.dataset.file,f.files[0]);save();openSetup()});
let confirmDel=null;
su.addEventListener('click',async e=>{const b=e.target.closest('[data-op]');if(!b)return;const op=b.dataset.op;
 const c=b.closest('[data-pi]'),i=c?+c.dataset.pi:-1;readForm();
 if(op==='close'){save();su.classList.remove('on');render();jump(cfg.settings.startIndex);return}
 if(op==='full'){const d=document.documentElement;try{await(d.requestFullscreen||d.webkitRequestFullscreen).call(d)}catch(err){toast('Full screen is not available here. On iPhone use Add to Home Screen.',3000)}return}
 if(op==='reset-likes'){for(const k in st)delete st[k];toast('Likes reset');return}
 if(op==='reset'){if(confirmDel!=='reset'){confirmDel='reset';b.textContent='Tap again to confirm';return}
  for(const p of cfg.posts){await clearFile(p,'video');await clearFile(p,'avatar')}cfg=clone(DEFAULT);for(const k in st)delete st[k];for(const k in urls)delete urls[k];render();await loadFolder(refreshPost)}
 if(op==='up'&&i>0)[cfg.posts[i-1],cfg.posts[i]]=[cfg.posts[i],cfg.posts[i-1]];
 if(op==='down'&&i<cfg.posts.length-1)[cfg.posts[i+1],cfg.posts[i]]=[cfg.posts[i],cfg.posts[i+1]];
 if(op==='clrv')await clearFile(cfg.posts[i],'video');
 if(op==='del'){if(confirmDel!==cfg.posts[i].id){confirmDel=cfg.posts[i].id;b.textContent='Tap again to delete';return}
  await clearFile(cfg.posts[i],'video');await clearFile(cfg.posts[i],'avatar');cfg.posts.splice(i,1)}
 if(op==='add')cfg.posts.push({id:'p'+Date.now(),user:'new.creator',verified:false,caption:'new post #foryou',sound:'original audio · new.creator',likes:12000,comments:240,reposts:300,shares:120,saves:500,overlay:'',palette:cfg.posts.length%PAL.length,green:false,commentsText:'someone | love this | 120'});
 confirmDel=null;cfg.settings.startIndex=Math.min(cfg.settings.startIndex,Math.max(0,cfg.posts.length-1));save();
 const y=su.scrollTop;openSetup();su.scrollTop=op==='add'?su.scrollHeight:y;
});

/* videos/1.mp4 → post 1, avatars/1.jpg → post 1's profile pic. Works as a website and when opened as a file */
const diag={};
const isWeb=location.protocol.startsWith('http');
const probe=(src,kind)=>new Promise(res=>{const el=document.createElement(kind==='video'?'video':'img');let done=false;
 const fin=ok=>{if(done)return;done=true;clearTimeout(t);if(kind==='video'){el.removeAttribute('src');el.load()}res(ok)};
 const t=setTimeout(()=>fin(false),9000);
 if(kind==='video'){el.preload='metadata';el.muted=true;el.onloadedmetadata=()=>fin(true)}else el.onload=()=>fin(true);
 el.onerror=()=>fin(false);el.src=src});
const names=(n,exts)=>{const out=[];for(const b of [n,'0'+n])for(const x of exts)for(const e of [x,x.toUpperCase()])out.push(b+'.'+e);
 for(const x of exts)out.push(n+'.'+x+'.'+x,n+'.'+x+'.mp4');return [...new Set(out)]};
const exists=async src=>{try{const r=await fetch(src,{method:'HEAD',cache:'no-store'});return r.ok}catch(e){return null}};
async function findMedia(dir,n,kind){
 const exts=kind==='video'?['mp4','mov','m4v','webm']:['jpg','jpeg','png','webp','heic'];
 const list=names(n,exts).map(name=>({name,src:dir+'/'+encodeURIComponent(name)}));
 if(isWeb){ /* ask the server about every possible name at once, keep the first that exists */
  let net=true;
  for(const group of [list.slice(0,4),list.slice(4)]){
   const res=await Promise.all(group.map(c=>exists(c.src)));
   const i=res.findIndex(x=>x===true);
   if(i>=0)return {...group[i],status:'ok'};
   if(res.some(x=>x===null))net=false}
  if(net)return {status:'missing'}}
 for(const c of list){if(await probe(c.src,kind))return {...c,status:'ok'}}  /* opened as a file: try each name */
 return {status:'missing'}}
function refreshPost(i){const old=feed.querySelector(`.post[data-i="${i}"]`);if(!old)return;
 const t=document.createElement('div');t.innerHTML=postHTML(cfg.posts[i],i);const el=t.firstElementChild;
 if(old.classList.contains('paused'))el.classList.add('paused');
 if(io){io.unobserve(old);io.observe(el)}old.replaceWith(el);
 if(i===cur){cur=-1;activate(el)}}
async function loadFolder(onEach){
 const s0=cfg.settings.startIndex||0;
 const one=async(p,i)=>{
  const d=diag[p.id]={};
  if(!urls[p.id+':avatar'])findMedia('avatars',i+1,'image').then(r=>{d.avatar=r;if(r.src){urls[p.id+':avatar']=r.src;onEach&&onEach(i)}});
  if(urls[p.id+':video']){d.video={status:'picked'};return}
  const r=await findMedia('videos',i+1,'video');d.video=r;
  if(r.src){urls[p.id+':video']=r.src;onEach&&onEach(i);
   if(isWeb)probe(r.src,'video').then(ok=>{if(!ok)d.video={name:r.name,status:'unplayable'}})}};
 await one(cfg.posts[s0],s0);
 await Promise.all(cfg.posts.map((p,i)=>i===s0?null:one(p,i)))}
function diagLine(p,i){const v=(diag[p.id]||{}).video;if(!v)return'';
 if(v.status==='picked')return'<p class="note" style="color:#7d9">✓ Using a video chosen on this phone</p>';
 if(v.status==='ok')return`<p class="note" style="color:#7d9">✓ Loaded videos/${esc(v.name)}</p>`;
 if(v.status==='unplayable')return`<p class="note" style="color:#ffb35c">⚠ Found videos/${esc(v.name)} but this browser can't play it. It's probably an iPhone HEVC video or very large. Export it again as H.264 MP4 (for example from DaVinci Resolve) and name it ${i+1}.mp4.</p>`;
 return`<p class="note" style="color:#ff8a8a">✗ ${isWeb?'No video named '+(i+1)+'.mp4 in the videos folder on this website.':'No playable video named '+(i+1)+'.mp4 in the videos folder.'}</p>`}
(async()=>{
 render();jump(cfg.settings.startIndex||0);hashSetup();
 const within=(pr,ms)=>Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej(new Error('phone storage did not respond')),ms))]);
 for(const p of cfg.posts)for(const k of ['video','avatar']){if(!p['has_'+k])continue;
  try{const b=await within(getF(p.id+':'+k),2500);if(b){urls[p.id+':'+k]=URL.createObjectURL(b);refreshPost(cfg.posts.indexOf(p))}else p['has_'+k]=false}catch(e){persistOK=false;__errs.push(String(e.message||e))}}
 await loadFolder(refreshPost);
 if(su.classList.contains('on')){readForm();const y=su.scrollTop;openSetup();su.scrollTop=y}  /* refresh the video check if setup was already open */
 let seen=false;try{seen=localStorage.getItem(KEY+':hint')}catch(e){}
 const nVid=cfg.posts.filter(p=>urls[p.id+':video']).length;
 if(!nVid)setTimeout(()=>toast('No videos found. Tap the swirl logo 3 times to see why.',4000),700);
 else if(!seen){setTimeout(()=>toast('Crew tip: tap the swirl logo three times for setup',3500),600);try{localStorage.setItem(KEY+':hint','1')}catch(e){}}
})();
}
